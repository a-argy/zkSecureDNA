[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@sp1-contracts/=lib/sp1-contracts/contracts/src/",
]
