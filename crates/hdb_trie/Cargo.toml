[package]
name = "hdb_trie"
version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2021"

# Builds the Merkle trie over the HDB and produces lookup proofs. Proof
# verification lives in zk_types::trie (it also runs in the record circuit).
[dependencies]
zk_types = { path = "../zk_types" }
rayon = "1.10.0"
rand = "0.8.5"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bincode = "1.3.3"
serde_json = "1.0"

[dev-dependencies]
tempfile = { workspace = true }
