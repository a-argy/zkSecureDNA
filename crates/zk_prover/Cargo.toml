[package]
name = "zk_prover"
version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2021"

# Host side of the zkSecureDNA circuits: runs/proves them for the client and
# verifies the final proof for the HDB. The guest programs live in ../../zk.
[dependencies]
anyhow = "1.0.75"
bincode = "1.3.3"
rand = "0.8.5"
serde = { workspace = true, features = ["derive"] }
sp1-sdk = "6.9.0"
thiserror = "1.0.47"
tokio = { version = "1", features = ["sync", "rt"] }
tracing = { workspace = true }

doprf = { path = "../doprf" }
packed_ristretto = { path = "../packed_ristretto" }
zk_types = { path = "../zk_types" }

[build-dependencies]
sp1-build = "6.9.0"
