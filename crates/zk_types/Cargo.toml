[package]
name = "zk_types"
version.workspace = true
license.workspace = true
publish.workspace = true
edition = "2021"

# Shared between the SP1 guest programs (zk/programs/*) and the host crates.
# Keep dependencies minimal: this crate is compiled for the zkVM target too.
[dependencies]
serde = { version = "1.0", default-features = false, features = ["derive"] }
sha2 = { version = "0.10.9", default-features = false }
