# SP1 guest programs for zkSecureDNA. This is a separate workspace because the
# guests compile for the zkVM target and need SP1's precompile-patched crates.
# Built automatically by crates/zk_prover/build.rs.
[workspace]
members = ["programs/hash", "programs/checksum", "programs/aggregate", "programs/record"]
resolver = "2"

[workspace.dependencies]
sp1-zkvm = "6.9.0"
curve25519-dalek = { version = "4.1.3", features = ["digest", "rand_core"] }
sha2 = "0.10.9"
sha3 = "0.10.8"
bincode = "1.3.3"
doprf = { path = "../crates/doprf", default-features = false }
packed_ristretto = { path = "../crates/packed_ristretto", default-features = false }
zk_types = { path = "../crates/zk_types" }
zk_escrow = { path = "../crates/zk_escrow" }
ed25519-dalek = { version = "2.1", default-features = false }
alloy-sol-types = "1.0"

# Route SHA3-512 and Ristretto arithmetic through SP1's accelerated precompiles.
# These dominate the circuits' cycle counts.
[patch.crates-io]
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.10.8-sp1-6.2.0" }
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
curve25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
ed25519-dalek = { git = "https://github.com/sp1-patches/curve25519-dalek", tag = "patch-4.1.3-sp1-6.2.0" }
